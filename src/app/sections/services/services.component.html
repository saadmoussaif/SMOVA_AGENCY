<section class="services" id="services">
  <div class="section-heading">
    <span>{{ i18n.t('services.kicker') }}</span>
    <h2>{{ i18n.t('services.title') }}</h2>
    <p>{{ i18n.t('services.subtitle') }}</p>
  </div>

  <div class="service-grid">
    <article *ngFor="let service of services" class="service-card">
      <div class="service-photo">
        <img [src]="service.image" [alt]="service.alt" loading="lazy">
        <span class="service-icon">
          <i-lucide [name]="service.icon"></i-lucide>
        </span>
      </div>
      <h3>{{ i18n.t(service.titleKey) }}</h3>
      <p>{{ i18n.t(service.textKey) }}</p>
      <div class="service-tags">
        <span *ngFor="let tag of service.tags">{{ tag }}</span>
      </div>
      <a class="service-link"
         [routerLink]="service.link"
         [attr.aria-label]="i18n.t('services.see_more_aria') + ' ' + i18n.t(service.titleKey)">
        {{ i18n.t('services.see_more') }}
        <i-lucide name="arrow-right"></i-lucide>
      </a>
    </article>
  </div>
</section>
